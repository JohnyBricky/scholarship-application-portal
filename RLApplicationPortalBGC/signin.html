<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — Real LIFE Foundation (BGC)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top rl-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="assets/rl/Logo/Real LIFE Logo black.png" alt="Real LIFE Foundation Logo" style="height: 40px; width: auto;" />
        <span class="badge bg-success-subtle text-success-emphasis border border-success-subtle d-none d-sm-inline"><span class="client-name-text">BGC</span> Center</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-outline-rl btn-sm">Back to Home</a>
      </div>
    </div>
  </nav>

  <main class="section-pad">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-0 shadow-sm p-4">
            <h3 class="fw-bold mb-1">Sign In</h3>
            <p class="text-muted small mb-4">Enter your email and password to view your application status or access the portal.</p>

            <form id="loginForm" class="d-grid gap-3">
              <div>
                <label for="loginEmail" class="form-label small fw-semibold">Email Address</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" required />
              </div>
              <div>
                <label for="loginPassword" class="form-label small fw-semibold">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required />
              </div>
              <div id="loginError" class="small text-danger d-none"></div>
              <button type="submit" class="btn btn-rl">Sign In</button>
            </form>

            <div class="mt-3 text-center">
              <button type="button" class="btn btn-link btn-sm text-decoration-none" onclick="document.getElementById('otpLoginBox').classList.toggle('d-none')">
                Forgot password or registered with OTP? Sign in with Email OTP
              </button>
            </div>

            <div id="otpLoginBox" class="mt-3 p-3 bg-light border rounded d-none">
              <form id="otpLoginSendForm" class="d-grid gap-2 mb-2">
                <label for="otpLoginEmail" class="form-label small fw-semibold mb-0">Account Email</label>
                <div class="input-group input-group-sm">
                  <input type="email" id="otpLoginEmail" class="form-control" placeholder="you@example.com" required />
                  <button type="submit" class="btn btn-outline-rl">Send OTP</button>
                </div>
              </form>
              <div id="otpLoginNotice" class="small text-success mb-2 d-none"></div>
              <form id="otpLoginVerifyForm" class="d-none">
                <div class="input-group input-group-sm">
                  <input type="text" id="otpLoginCode" class="form-control" maxlength="6" pattern="[0-9]{6}" placeholder="6-digit OTP" required />
                  <button type="submit" class="btn btn-rl">Verify &amp; Sign In</button>
                </div>
              </form>
              <div id="otpLoginError" class="small text-danger mt-2 d-none"></div>
            </div>

            <hr class="my-4" />

            <div class="text-center">
              <p class="small text-muted mb-2">New to the Real LIFE <span class="client-name-text">BGC</span> Scholarship?</p>
              <a href="register.html" class="btn btn-outline-rl w-100">Apply to the program</a>
              <div class="mt-3">
                <a href="privacy.html" class="small text-muted text-decoration-underline">Privacy Policy &amp; Terms (Philippines)</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/components/core.js"></script>
  <script src="js/components/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
